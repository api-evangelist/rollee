notes: >-
  Rollee ships client-side "Rollee Connect" SDKs (the embeddable account-linking
  flow), not server-side API clients. React and React Native SDKs are published to
  npm under the official @getrollee scope. Web JS and Flutter integrations are
  documented but distributed as loader snippets / platform plugins rather than a
  registry package.
