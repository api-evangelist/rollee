aid: rollee
name: Rollee
description: >-
  Rollee is an Open Finance / employment-data platform that lets fintechs, lenders,
  and HR platforms verify the income, employment, and work history of both salaried
  and self-employed workers in real time. Through a single API and the embeddable
  Rollee Connect flow, Rollee aggregates data from 70+ sources — gig-economy
  platforms (Uber, Bolt, Deliveroo, Just Eat, Stuart, and more), government tax
  portals, payroll systems, and digital wallets — and normalizes it into a common
  "Rollee Standard" schema covering income, transactions, employment, activity,
  assets, banking info, documents, and vehicles. It powers consumer lending,
  vehicle financing, tenant and income verification, earned-wage access, and
  recruitment / work-history checks. The platform is ISO 27001 certified and
  GDPR-compliant, and is backed by Seedcamp and Speedinvest.
